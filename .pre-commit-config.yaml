default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --verbose]

  - repo: local
    hooks:
      - id: ruff
        name: ruff annotation check
        entry: ruff
        args: [check, --select, ANN]
        language: python
        additional_dependencies: [ruff]
        types: [python]
        stages: [pre-commit]
      - id: ty
        name: ty type check
        entry: ty
        args: [check]
        language: python
        additional_dependencies: [ty]
        types: [python]
        stages: [pre-commit]