repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff annotation check
        entry: ruff
        args: [check, --select, ANN]
        language: python
        additional_dependencies: [ruff]
        types: [python]
      - id: ty
        name: ty type check
        entry: ty
        args: [check]
        language: python
        additional_dependencies: [ty]
        types: [python]
        pass_filenames: false