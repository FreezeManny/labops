repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff annotation check
        entry: .venv/bin/ruff check --select ANN
        language: system
        types: [python]
      - id: ty
        name: ty type check
        entry: .venv/bin/ty check
        language: system
        types: [python]
        pass_filenames: false