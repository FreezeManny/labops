default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Positional types REPLACE the built-in set, so the defaults are listed
        # explicitly here alongside the extra `wip` type used during development.
        args: [--strict, --verbose,
               build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test,
               wip]

  - repo: local
    hooks:
      - id: ruff
        name: ruff annotation check
        entry: ruff
        args: [check, --select, ANN]
        language: python
        additional_dependencies: [ruff]
        types: [python]
        stages: [pre-commit]
      - id: ty
        name: ty type check
        entry: ty
        args: [check]
        language: python
        additional_dependencies: [ty]
        types: [python]
        stages: [pre-commit]