# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # Python runtime + tooling deps (pyproject.toml / uv.lock). The `uv`
  # ecosystem maintains the lockfile; `pip` would leave it stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
        dependency-type: "development"

  # Workflow actions are pinned to floating major tags, so without this they
  # drift silently and never surface a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
