# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    # Nothing here reaches the published wheel, so it must not cut a release.
    # Stated explicitly rather than left to Dependabot's inference from commit
    # history, which now contains `fix(deps)` commits too.
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python runtime + tooling deps (pyproject.toml / uv.lock). The `uv`
  # ecosystem maintains the lockfile; `pip` would leave it stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    # Runtime dependencies ship inside the wheel: bumping one changes what
    # users install, so it belongs in the changelog. `fix` lands it in a
    # visible release-please section, which is the whole reason a release PR
    # gets opened — `chore` is hidden, and a run of `chore(deps)` commits
    # leaves release-please with nothing user facing to release.
    # Development dependencies change nothing that ships, so they stay hidden.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      python-dev:
        patterns: ["*"]
        dependency-type: "development"

  # Workflow actions are pinned to floating major tags, so without this they
  # drift silently and never surface a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    # CI-only, like the devcontainer: never a release on its own.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
