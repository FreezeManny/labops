name: PR Title

on:
  # Only the events that can change the title. `synchronize` (a new commit
  # pushed to the PR) leaves the title untouched, so it re-ran the same check
  # for the same string on every push.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

# Editing a title several times in a row supersedes the earlier checks.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed conventional-commit types. Keep in sync with the
          # release-please changelog sections.
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            ci
            build
            perf
            style
            revert
