name: Publish

on:
  release:
    types: [published]

# Two releases published close together must not race for the same version on
# PyPI; an in-flight upload is never cancelled half-way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: python
    runs-on: ubuntu-latest

    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No `uv sync`: the build backend runs in its own isolated environment, so
      # the project's own dependencies are never needed to produce a wheel.
      - name: Build
        run: uv build

      # Trusted publishing — the job's id-token permission and the `pypi`
      # environment stand in for an API token.
      - name: Publish
        run: uv publish