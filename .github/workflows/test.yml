name: Test

on:
  # The pull request is the gate: every change reaches main through one, so
  # testing pull requests tests everything that can land. The old bare `push:`
  # fired on every branch as well, which ran a second, identical job before the
  # PR was even open.
  pull_request:
  # For re-running against a branch without pushing an empty commit.
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run obsolete — drop it rather
# than pay for a result nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `pytest` because the Main-Protection ruleset requires that check by
  # name; renaming the job silently un-gates the branch.
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Lint & type-check
        run: just check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest
