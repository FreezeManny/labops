name: Release Please

on:
  push:
    branches:
      - main
  schedule:
    # Weekly auto-release every Saturday at midnight UTC
    - cron: "0 0 * * 6"
  workflow_dispatch:

# Two merges in quick succession would otherwise race to update the same
# release PR; the newest wins, and an in-flight run is left to finish.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # A PAT rather than GITHUB_TOKEN: releases created with the default token
      # do not emit events, so Publish and Docs would never fire.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.ACTIONS_TOKEN }}
          skip-labeling: false

  weekly-autorelease:
    name: Merge pending release PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Merge open autorelease PRs
        env:
          # Using ACTIONS_TOKEN so that merging the PR triggers the `push` to
          # `main`, which in turn runs `release-please` to tag and publish.
          GH_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --repo "$REPO" --state open --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
          done