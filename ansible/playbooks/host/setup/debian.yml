---
- name: Setup user with passwordless permissions
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure python3 and sudo are installed via raw
      ansible.builtin.raw: apt-get update && apt-get install -y python3 sudo
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Import common setup tasks
      ansible.builtin.import_tasks: setup-common.yml
