---
# Update a Docker stack: pull the latest images and recreate changed containers.
# Does NOT sync config files — run deploy.yml if you also need to push config changes.
#
# Required extra vars:
#   compose_dest – remote destination path  (docker_root/stack_name)
#   stack_name   – human-readable stack identifier

- name: Update Docker stack
  hosts: all
  gather_facts: false
  tasks:
    - name: Pull latest images and recreate changed containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dest }}"
        project_name: "{{ stack_name }}"
        state: present
        pull: always
        recreate: auto
        wait: true
      become: true
      register: compose_result

    - name: List images of stack services
      ansible.builtin.command:
        argv: [docker, image, ls, --all, --quiet, --filter, "reference={{ item }}"]
      loop: "{{ compose_result.images | default([]) | map(attribute='Repository') | select | unique | list }}"
      become: true
      register: image_list
      changed_when: false
      check_mode: false

    - name: Remove older images of stack services
      # Without --force, docker refuses to remove images still used by a container.
      ansible.builtin.command:
        argv: [docker, image, rm, "{{ item }}"]
      loop: "{{ image_list.results | map(attribute='stdout_lines') | flatten | unique | list }}"
      become: true
      register: image_rm
      changed_when: "'Deleted:' in image_rm.stdout or 'Untagged:' in image_rm.stdout"
      failed_when: image_rm.rc != 0 and 'image is being used' not in image_rm.stderr and 'must force' not in image_rm.stderr
