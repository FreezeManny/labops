---
# Sync the rendered Caddyfile, then reload Caddy — but only if the file actually
# changed (reload.yml keys off the `caddyfile_write` register from sync.yml). So
# a deploy that changes nothing writes nothing and reloads nothing.

- name: Sync the Caddyfile
  ansible.builtin.import_playbook: sync.yml

- name: Reload Caddy if the Caddyfile changed
  ansible.builtin.import_playbook: reload.yml
