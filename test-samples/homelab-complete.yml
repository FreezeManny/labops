settings:
  default_creds:
    username: root
    passwd: changeme
    #ssh_key_path: xxxxx
  # Secret store for API tokens (e.g. CF_API_TOKEN). Defaults to a `.env` next to
  # this config file; uncomment to point elsewhere (relative to this file, or
  # absolute). The file is git-ignored and never written by labops.
  # env_file: .env
  # Local DNS records, published to Pi-hole v6. There is no record list here:
  # every host / VM / LXC below becomes `<name><local_dns_suffix> -> ip`, so a
  # device that only needs a DNS entry is simply a node with `os: unmanaged`
  # (see `nas` at the bottom). Per node: `dns_name` renames or aliases it,
  # `dns: false` leaves it out. `labops dns list` shows the result offline.
  dns:
    # Appended to each node's name. A leading dot is optional — `.lab` and `lab`
    # both yield `cprox.lab`.
    local_dns_suffix: .lab
    # Where Pi-hole is. Optional — leave it out and records are still derived, so
    # `dns list` works before you have a Pi-hole to point at. Three things are
    # accepted, and which one you write decides what `dns upgrade` may do:
    #   * a config node (name, IP or vmid) — records + upgrades;
    #   * a docker stack name — records go to the node running it, and
    #     `dns upgrade` refuses (a container is upgraded by pulling an image);
    #   * a bare IP matching nothing here — records only, nothing to SSH into.
    # One field, because `dns sync` needs an address and `dns upgrade` needs the
    # thing behind it, and they must not disagree about which Pi-hole is meant.
    #
    # Only one instance: the secret store holds a single PIHOLE_PASSWORD, so a list
    # would assume they all share one API password. With a replicating setup
    # (nebula-sync) point labops at the primary and let it propagate to the rest.
    pihole_location: pihole      # the `pihole` LXC under cprox (10.0.10.5)
    # Where the Pi-hole v6 admin/API listens. Default is 80; this sample's Pi-hole
    # publishes its web interface on 8080 (see that LXC's web_services).
    api_port: 8080
    # api_scheme: http           # http | https (https skips cert verification,
    #                              since Pi-hole's own cert is self-signed)
    # The API password comes from PIHOLE_PASSWORD in the .env secret store (see
    # settings.env_file) — either the web-interface password or an app password
    # from Settings → Web interface / API. To inline it instead (clear text in
    # this file, and `dns sync` warns) set:
    # password: "xxxxxxxx"
    #
    # What `labops dns upgrade` runs on pihole_location. Upgrading Pi-hole is the
    # one operation with no API behind it, so it goes over SSH (or pct for an LXC).
    # It is also not covered by `lxc update` / `host update`: those run the package
    # manager, and Pi-hole installs from its own installer, so apt never sees it.
    # Bare installs only — a containerised Pi-hole is upgraded by pulling a new
    # image (`docker stack update`).
    # upgrade_command: pihole -up --check-only   # default is `pihole -up`
  proxy:
    proxy_suffix: .mfritz.top
    # Optional: render the Caddyfile from your own Jinja template instead of the
    # built-in one. Relative to this file, or absolute. The template must exist.
    # It can replace the built-in template outright, or extend it and override
    # only the parts it cares about — blocks: header, global_options, log,
    # routes, extra, fallback:
    #
    #   {% extends "builtin/Caddyfile.j2" %}
    #   {% block global_options %}
    #   {
    #     email me@example.com
    #   }
    #   {% endblock %}
    #
    # The variables in scope (proxy_suffix, tls_lines, tls_plugin, routes) and
    # the full block list are documented in ansible/files/proxy/README.md.
    # `proxy render` prints the result without deploying it.
    # template: ./caddy/Caddyfile.j2
    # Optional: where Caddy runs, so `proxy sync`/`proxy deploy` can push the
    # rendered Caddyfile over SSH and reload it. Omit for render-only.
    deploy:
      # A host / VM / LXC in this config (by name, IP or vmid) that runs Caddy.
      # Hosts/VMs are reached over SSH; an LXC is reached via the Proxmox node
      # using pct (no sshd needed in the container).
      target: docker                     # the `docker` LXC under cprox (vmid 102)
      # Absolute remote path the Caddyfile is written to. In docker mode this is
      # the host path bind-mounted into the container.
      caddyfile_dest: /home/manuel/Caddy/volumes/caddy/Caddyfile
      # The presence of this `docker:` block selects docker mode. Omit it entirely
      # for a host-mode target (bare `caddy` on the host) — then target +
      # caddyfile_dest is all you need.
      docker:
        container: caddy                 # container to `docker exec` into to reload
        # container_caddyfile_path: /etc/caddy/Caddyfile   # mount target; default shown
      # Optional: replace the whole reload command (runs verbatim over SSH).
      # Overrides the mode default; when set, `docker.container` is not required.
      # reload_command: docker compose -f /home/manuel/Caddy/compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
    # tls is optional: omit it to serve the wildcard over plain HTTP (e.g. an
    # internal `.lan` suffix with no cert) — Caddy renders `http://*.<suffix>`.
    # When present, labops issues a wildcard cert via the provider's ACME DNS-01
    # challenge.
    tls:
      # One provider at a time. `none` is the off switch; the other names come
      # from the registry in src/proxy/tls_providers.py, which also fixes each
      # provider's credential env var and the caddy-dns plugin the Caddy image
      # must be built with (labops renders the Caddyfile, not the image).
      provider: cloudflare     # none | cloudflare
      # No token here by default: labops renders `dns cloudflare {env.CF_API_TOKEN}`
      # and Caddy resolves that var from its container env at runtime, so the
      # secret never lands in the config or the rendered Caddyfile. labops also
      # reads the same key from the .env next to this file (see settings.env_file)
      # only to warn if it's missing. To inline the token instead (rendered
      # literally — discouraged), set:
      # token: "cf-xxxxxxxx"
    access_lists:
      local:                 # default: used by services with no explicit access
        default: true
        accept:
          - 10.0.10.0/24
          - 10.0.20.0/24
        # deny wins over accept — block a host even though it's in the subnet:
        # deny:
        #   - 10.0.10.66/32
      vpn:
        accept:
          - 100.64.0.0/10    # tailscale
      open:                  # accept-all == public
        accept:
          - 0.0.0.0/0
          - ::/0             # needed too: an IPv4-only accept list 403s IPv6 clients
  # Reusable named selections for `labops update <name>`. The same four fields as
  # the CLI options (--kind/--os/--tag/--under), combined as AND across fields and
  # OR within one. Empty fields mean "no constraint", so a set with only
  # `kind: [lxc]` is every container regardless of os, tags or position.
  targets:
    weekly:                  # the debian guests patched on Sundays
      kind: [vm, lxc]
      os: [debian]
    edge:                    # the production side of cprox, containers included
      under: [cprox]
      tags: [prod]
    containers:
      kind: lxc              # single value; coerced to a list

hosts:
  # A node name becomes a DNS label, so it must be a legal one — no underscores.
  # (Only enforced when settings.dns is configured; a node with an explicit
  # dns_name is exempt, since its own name is never published.)
  proxmox-test:
    type: proxmox
    os: debian
    ip: 10.0.10.44
    lxc:
      wireguard-2:
        ip: 10.0.10.8
        os: alpine
        vmid: 101

  cprox:
    type: proxmox
    os: debian
    ip: 10.0.10.3
    # Free-form labels, matched by `labops update --tag prod`. Tags are local to
    # the node that carries them — they are not inherited by its VMs or LXCs, so
    # a container is only "prod" if it says so itself. Use --under to sweep a
    # subtree.
    tags: [prod, proxmox]
    web_services:
      - proxy_name: cprox
        port: 82
        access: vpn          # single list (coerced to a list); reachable over tailscale
      - proxy_name: pve      # Proxmox web UI: HTTPS upstream with a self-signed cert
        port: 8006
        access: vpn
        https: true          # reverse_proxy over https:// + skip TLS verification
    lxc:
      wireguard:
        ip: 10.0.10.2
        os: alpine
        vmid: 100
      tailscale:
        ip: 10.0.20.3
        os: alpine
        vmid: 101
      docker:
        ip: 10.0.10.6
        os: debian
        vmid: 102
        tags: [prod, media]
        docker:
          root_path: "/home/manuel"
          stacks:
            nginx-proxy-manager:
              config_path: "./docker/nginx/"
              web_services:
                - proxy_name: nginx
                  port: 81
            nebula-sync:
              config_path: "./docker/nebula-sync/"
            dfs-aip-interface:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: dfs-aip
                  port: 8081

      home:
        ip: 10.0.10.10
        os: debian
        vmid: 103
        docker:
          root_path: "/home/manuel"
          stacks:
            homeassistant:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: esphome
                  port: 6052
                - proxy_name: home
                  port: 8123
                - proxy_name: z2mqtt
                  port: 8080

      pihole:
        ip: 10.0.10.5
        os: debian
        vmid: 105
        web_services:
          - proxy_name: pihole
            port: 8080

    vm:
      fr24-radar:
        os: debian
        ip: 10.0.50.149
        vmid: 111
        dns_name: fr24         # -> fr24.lab, not fr24-radar.lab

      # HomeAssistant OS — a real proxmox VM, but an appliance OS that labops
      # cannot apt-update or SSH-provision. os: unmanaged → skipped by
      # update/setup, but still listed and proxied via web_services.
      homeassistant-os:
        os: unmanaged
        ip: 10.0.10.20
        vmid: 120
        dns_name: [hass, ha]   # several labels -> one address (hass.lab, ha.lab)
        web_services:
          - proxy_name: hass
            port: 8123

  test-system:
    os: debian
    ip: 10.0.10.42

  tmp-pi:
    os: debian
    ip: 10.0.10.254
    dns: false               # scratch box — tracked, but not published to DNS

  lifeboat:
    type: bare-metal
    os: debian
    ip: 10.0.10.9
    web_services:
      - proxy_name: pihole2
        port: 8080

  # A NAS appliance: not managed by labops, but still tracked for ip + proxy.
  nas:
    type: bare-metal
    os: unmanaged
    ip: 10.0.10.4
    web_services:
      - proxy_name: nas
        port: 80
        access: [open]          # accept-all list -> open to anyone
      - proxy_name: sync
        port: 20910
        access: [local, vpn]    # union of both lists
