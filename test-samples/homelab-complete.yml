settings:
  default_creds:
    username: root
    passwd: changeme
    #ssh_key_path: xxxxx
  # Secret store for API tokens (e.g. CF_API_TOKEN). Defaults to a `.env` next to
  # this config file; uncomment to point elsewhere (relative to this file, or
  # absolute). The file is git-ignored and never written by labops.
  # env_file: .env
  dns:
    local_dns_suffix: .lab
    pihole_location: 10.0.10.5 
  proxy:
    proxy_suffix: .mfritz.top
    # Optional: render the Caddyfile from your own Jinja template instead of the
    # built-in one. Relative to this file, or absolute. The template must exist.
    # It can replace the built-in template outright, or extend it and override
    # only the parts it cares about — blocks: header, global_options, log,
    # routes, extra, fallback:
    #
    #   {% extends "builtin/Caddyfile.j2" %}
    #   {% block global_options %}
    #   {
    #     email me@example.com
    #   }
    #   {% endblock %}
    #
    # The variables in scope (proxy_suffix, tls_lines, tls_plugin, routes) and
    # the full block list are documented in ansible/files/proxy/README.md.
    # `proxy render` prints the result without deploying it.
    # template: ./caddy/Caddyfile.j2
    # Optional: where Caddy runs, so `proxy sync`/`proxy deploy` can push the
    # rendered Caddyfile over SSH and reload it. Omit for render-only.
    deploy:
      # A host / VM / LXC in this config (by name, IP or vmid) that runs Caddy.
      # Hosts/VMs are reached over SSH; an LXC is reached via the Proxmox node
      # using pct (no sshd needed in the container).
      target: docker                     # the `docker` LXC under cprox (vmid 102)
      # Absolute remote path the Caddyfile is written to. In docker mode this is
      # the host path bind-mounted into the container.
      caddyfile_dest: /home/manuel/Caddy/volumes/caddy/Caddyfile
      # The presence of this `docker:` block selects docker mode. Omit it entirely
      # for a host-mode target (bare `caddy` on the host) — then target +
      # caddyfile_dest is all you need.
      docker:
        container: caddy                 # container to `docker exec` into to reload
        # container_caddyfile_path: /etc/caddy/Caddyfile   # mount target; default shown
      # Optional: replace the whole reload command (runs verbatim over SSH).
      # Overrides the mode default; when set, `docker.container` is not required.
      # reload_command: docker compose -f /home/manuel/Caddy/compose.yml exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
    # tls is optional: omit it to serve the wildcard over plain HTTP (e.g. an
    # internal `.lan` suffix with no cert) — Caddy renders `http://*.<suffix>`.
    # When present, labops issues a wildcard cert via the provider's ACME DNS-01
    # challenge.
    tls:
      # One provider at a time. `none` is the off switch; the other names come
      # from the registry in src/proxy/tls_providers.py, which also fixes each
      # provider's credential env var and the caddy-dns plugin the Caddy image
      # must be built with (labops renders the Caddyfile, not the image).
      provider: cloudflare     # none | cloudflare
      # No token here by default: labops renders `dns cloudflare {env.CF_API_TOKEN}`
      # and Caddy resolves that var from its container env at runtime, so the
      # secret never lands in the config or the rendered Caddyfile. labops also
      # reads the same key from the .env next to this file (see settings.env_file)
      # only to warn if it's missing. To inline the token instead (rendered
      # literally — discouraged), set:
      # token: "cf-xxxxxxxx"
    access_lists:
      local:                 # default: used by services with no explicit access
        default: true
        accept:
          - 10.0.10.0/24
          - 10.0.20.0/24
        # deny wins over accept — block a host even though it's in the subnet:
        # deny:
        #   - 10.0.10.66/32
      vpn:
        accept:
          - 100.64.0.0/10    # tailscale
      open:                  # accept-all == public
        accept:
          - 0.0.0.0/0
          - ::/0             # needed too: an IPv4-only accept list 403s IPv6 clients

hosts:
  proxmox_test:
    type: proxmox
    os: debian
    ip: 10.0.10.44
    lxc:
      wireguard-2:
        ip: 10.0.10.8
        os: alpine
        vmid: 101

  cprox:
    type: proxmox
    os: debian
    ip: 10.0.10.3
    web_services:
      - proxy_name: cprox
        port: 82
        access: vpn          # single list (coerced to a list); reachable over tailscale
      - proxy_name: pve      # Proxmox web UI: HTTPS upstream with a self-signed cert
        port: 8006
        access: vpn
        https: true          # reverse_proxy over https:// + skip TLS verification
    lxc:
      wireguard:
        ip: 10.0.10.2
        os: alpine
        vmid: 100
      tailscale:
        ip: 10.0.20.3
        os: alpine
        vmid: 101
      docker:
        ip: 10.0.10.6
        os: debian
        vmid: 102
        docker:
          root_path: "/home/manuel"
          stacks:
            nginx-proxy-manager:
              config_path: "./docker/nginx/"
              web_services:
                - proxy_name: nginx
                  port: 81
            nebula-sync:
              config_path: "./docker/nebula-sync/"
            dfs-aip-interface:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: dfs-aip
                  port: 8081

      home:
        ip: 10.0.10.10
        os: debian
        vmid: 103
        docker:
          root_path: "/home/manuel"
          stacks:
            homeassistant:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: esphome
                  port: 6052
                - proxy_name: home
                  port: 8123
                - proxy_name: z2mqtt
                  port: 8080

      pihole:
        ip: 10.0.10.5
        os: debian
        vmid: 105
        web_services:
          - proxy_name: pihole
            port: 8080

    vm:
      fr24-radar:
        os: debian
        ip: 10.0.50.149
        vmid: 111

      # HomeAssistant OS — a real proxmox VM, but an appliance OS that labops
      # cannot apt-update or SSH-provision. os: unmanaged → skipped by
      # update/setup, but still listed and proxied via web_services.
      homeassistant-os:
        os: unmanaged
        ip: 10.0.10.20
        vmid: 120
        web_services:
          - proxy_name: hass
            port: 8123

  test-system:
    os: debian
    ip: 10.0.10.42

  tmp-pi:
    os: debian
    ip: 10.0.10.254

  lifeboat:
    type: bare-metal
    os: debian
    ip: 10.0.10.9
    web_services:
      - proxy_name: pihole2
        port: 8080

  # A NAS appliance: not managed by labops, but still tracked for ip + proxy.
  nas:
    type: bare-metal
    os: unmanaged
    ip: 10.0.10.4
    web_services:
      - proxy_name: nas
        port: 80
        access: [open]          # accept-all list -> open to anyone
      - proxy_name: sync
        port: 20910
        access: [local, vpn]    # union of both lists
