settings:
  default_creds:
    username: root
    passwd: changeme
    #ssh_key_path: xxxxx
  dns:
    local_dns_suffix: .lab
    pihole_location: 10.0.10.5 
  proxy:
    proxy_suffix: .mfritz.top
    proxy_location: 10.0.10.6           # SSH target that Caddy runs on
    caddyfile_path_remote: /etc/caddy/Caddyfile  # remote path the rendered config is written to
    # `proxy sync` writes the file; `proxy deploy` also runs `caddy reload` (init-agnostic).
    access_lists:
      local:                 # default: used by services with no explicit access
        default: true
        accept:
          - 10.0.10.0/24
          - 10.0.20.0/24
        # deny wins over accept — block a host even though it's in the subnet:
        # deny:
        #   - 10.0.10.66/32
      vpn:
        accept:
          - 100.64.0.0/10    # tailscale
      open:                  # accept-all == public
        accept:
          - 0.0.0.0/0

hosts:
  proxmox_test:
    type: proxmox
    os: debian
    ip: 10.0.10.44
    lxc:
      wireguard-2:
        ip: 10.0.10.8
        os: alpine
        vmid: 101

  cprox:
    type: proxmox
    os: debian
    ip: 10.0.10.3
    web_services:
      - proxy_name: cprox
        port: 82
        access: vpn          # single list (coerced to a list); reachable over tailscale
    lxc:
      wireguard:
        ip: 10.0.10.2
        os: alpine
        vmid: 100
      tailscale:
        ip: 10.0.20.3
        os: alpine
        vmid: 101
      docker:
        ip: 10.0.10.6
        os: debian
        vmid: 102
        docker:
          root_path: "/home/manuel"
          stacks:
            nginx-proxy-manager:
              config_path: "./docker/nginx/"
              web_services:
                - proxy_name: nginx
                  port: 81
            nebula-sync:
              config_path: "./docker/nebula-sync/"
            dfs-aip-interface:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: dfs-aip
                  port: 8081

      home:
        ip: 10.0.10.10
        os: debian
        vmid: 103
        docker:
          root_path: "/home/manuel"
          stacks:
            homeassistant:
              config_path: "./docker/homeassistant/"
              web_services:
                - proxy_name: esphome
                  port: 6052
                - proxy_name: home
                  port: 8123
                - proxy_name: z2mqtt
                  port: 8080

      pihole:
        ip: 10.0.10.5
        os: debian
        vmid: 105
        web_services:
          - proxy_name: pihole
            port: 8080

    vm:
      fr24-radar:
        os: debian
        ip: 10.0.50.149
        vmid: 111

      # HomeAssistant OS — a real proxmox VM, but an appliance OS that labops
      # cannot apt-update or SSH-provision. os: unmanaged → skipped by
      # update/setup, but still listed and proxied via web_services.
      homeassistant-os:
        os: unmanaged
        ip: 10.0.10.20
        vmid: 120
        web_services:
          - proxy_name: hass
            port: 8123

  test-system:
    os: debian
    ip: 10.0.10.42

  tmp-pi:
    os: debian
    ip: 10.0.10.254

  lifeboat:
    type: bare-metal
    os: debian
    ip: 10.0.10.9
    web_services:
      - proxy_name: pihole2
        port: 8080

  # A NAS appliance: not managed by labops, but still tracked for ip + proxy.
  nas:
    type: bare-metal
    os: unmanaged
    ip: 10.0.10.4
    web_services:
      - proxy_name: nas
        port: 80
        access: [open]          # accept-all list -> open to anyone
      - proxy_name: sync
        port: 20910
        access: [local, vpn]    # union of both lists
